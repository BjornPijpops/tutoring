name: Supabase keep-alive

# Free-tier Supabase projects pause after a week of inactivity; a small request twice a week prevents that.
on:
  schedule:
    - cron: '17 5 * * 1,4'
  workflow_dispatch:

permissions: {}

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - name: Ping Supabase REST endpoint
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::notice::SUPABASE_URL / SUPABASE_ANON_KEY not set; skipping keep-alive"
            exit 0
          fi
          case "$SUPABASE_URL" in
            https://*) ;;
            *)
              echo "::error::SUPABASE_URL must start with https://"
              exit 1
              ;;
          esac
          curl --fail --silent --show-error --max-time 30 --retry 3 -o /dev/null \
            -H "apikey: $SUPABASE_ANON_KEY" "${SUPABASE_URL%/}/rest/v1/"
          echo "Keep-alive request succeeded"
